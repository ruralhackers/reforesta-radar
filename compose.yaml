# docker compose up -d                        → web + API en http://127.0.0.1:${PORT:-8116}
# docker compose run --rm radar npm run radar → una pasada del radar (para cron)
services:
  radar:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8116 # dentro del contenedor siempre 8116; PORT de .env solo elige el puerto del host
    ports:
      - "127.0.0.1:${PORT:-8116}:8116"
    volumes:
      - datos:/app/data

volumes:
  datos:
